# Runs on Gitea Actions (Gitea reads .gitea/workflows).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Type check
        run: .venv/bin/mypy
      - name: Test
        run: .venv/bin/python -m pytest
